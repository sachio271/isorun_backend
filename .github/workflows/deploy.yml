name: Deploy NestJS Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build NestJS
        run: |
          npm ci
          npm run build

      # --- NEW: GENERATE .ENV FILE FROM SINGLE SECRET ---
      - name: Create .env file
        env:
          SECRET_ENV: ${{ secrets.SECRET_ENV }}
        run: |
          echo "$SECRET_ENV" > .env

      # --- UPDATED: COPY FILES TO SERVER ---
      - name: Copy files to Server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist, package.json, .env, prisma'
          target: '/var/www/backend'

      # --- UPDATED: SSH AND PRISMA GENERATE ---
      - name: SSH into Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # --- 1. LOAD ENVIRONMENT PATHS ---
            # This ensures npm, npx, and pm2 can be found
            source ~/.profile || true
            source ~/.bashrc || true
            export PATH=$PATH:/usr/local/bin:/usr/bin

            # (If you installed Node via NVM, this loads it)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # --- 2. RUN DEPLOYMENT COMMANDS ---
            cd /var/www/backend

            # Install production dependencies
            npm install --omit=dev

            # Generate the Prisma Client
            npx prisma generate

            # Restart or start the PM2 process
            pm2 restart backend || pm2 start dist/main.js --name "backend"
            pm2 save
